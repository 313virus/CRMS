{% extends 'base.html' %}{% block c %}
<div class="pw-wrap"><form method="post" class="auth-card">
  <img class="mark" src="{{ url_for('static', filename='logo-mark.png') }}" alt="">
  <h2>{{ t('change_pw') }}</h2><input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="fld"><span>{{ t('old_pw') }}</span><div class="inp"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg><input type="password" name="old" autocomplete="current-password" required></div></label>
  <label class="fld"><span>{{ t('new_pw') }}</span><div class="inp"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg><input type="password" name="new" autocomplete="new-password" required minlength="8"></div></label>
  <button class="go">{{ t('save') }}</button>
</form></div>{% endblock %}
